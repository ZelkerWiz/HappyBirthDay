<!doctype html>
<html lang="vi">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Birthday Cake</title>

    <link rel="stylesheet" href="CSS/cake.css" />
  </head>
  <body>
    <div class="background"></div>

    <div class="scene">
      
      <div class="cake">

        <div class="banner">
          <div class="rope left"></div>

          <div class="flag">HAPPY BIRTHDAY</div>

          <div class="rope right"></div>
          <div class="bunting">
            <span></span>
            <span></span>
            <span></span>
            <span></span>
            <span></span>
            <span></span>
            <span></span>
          </div>
        </div>

        <!-- Plate -->
        <div class="plate"></div>

        <!-- Bottom Layer -->
        <div class="layer bottom">
          <div class="cream"></div>
        </div>

        <!-- Top Layer -->
        <div class="layer top">
          <div class="cream"></div>
        </div>

        <!-- Cream Dots -->
        <div class="cream-dot dot1"></div>
        <div class="cream-dot dot2"></div>
        <div class="cream-dot dot3"></div>

        <div class="cream-dot dot4"></div>
        <div class="cream-dot dot5"></div>
        <div class="cream-dot dot6"></div>
        <div class="cream-dot dot7"></div>
        <div class="cream-dot dot8"></div>

        <!-- Cherries -->
        <div class="cherry cherry1"></div>
        <div class="cherry cherry2"></div>
        <div class="cherry cherry3"></div>

        <!-- Candle 1 -->
        <div class="candle candle-1">
          <div class="flame"></div>

          <div class="smoke"></div>

          <div class="number" style="font-size: 54px">1</div>
        </div>

        <!-- Candle 9 -->
        <div class="candle candle-9">
          <div class="flame"></div>

          <div class="smoke"></div>

          <div class="number" style="font-size: 54px">9</div>
        </div>
      </div>
      <div id="wish" class="text">Thổi nến i nha</div>

      <div id="countdown" class="text"></div>

      <div id="birthday" class="text">
        <h1>Happy Birthday</h1>
        <p>
          Chúc bà tuổi 19 luôn hạnh phúc, bình an và đạt được mọi điều mình mong
          muốn
        </p>
      </div>

      <button id="nextBtn">Quà nhỏ nhoi nhe</button>
    </div>

    <script src="JavaScript/cake.js"></script>
  </body>
</html>
